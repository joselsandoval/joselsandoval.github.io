<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Momentum Lab: Teacher Edition</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #app { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 850px; }
        canvas { border: 2px solid #333; background: #fafafa; display: block; margin: 10px auto; border-radius: 4px; }
        
        #problem-description { background: #e3f2fd; border-left: 5px solid #2196f3; padding: 15px; margin-bottom: 10px; border-radius: 4px; font-style: italic; }
        #algebra-box { background: #f1f8e9; border-left: 5px solid #4caf50; padding: 15px; margin-top: 20px; border-radius: 4px; display: none; }
        
        .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; justify-content: center; }
        .toggle-container { margin: 15px 0; text-align: center; border-top: 1px solid #eee; padding-top: 15px; }
        
        button { padding: 10px 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #218838; }
        
        .momentum-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        .momentum-table th, .momentum-table td { border: 1px solid #aaa; padding: 8px; text-align: center; }
        .header-before { background: #fff3e0; }
        .header-after { background: #e8f5e9; }
        .total-row { font-weight: bold; background: #f5f5f5; }
        .variable { color: #d32f2f; font-weight: bold; font-style: italic; }
        
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; vertical-align: middle; margin: 0 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4caf50; }
        input:checked + .slider:before { transform: translateX(26px); }
        .toggle-label { font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

    <h2>Momentum Conservation Lab</h2>
    
    <div id="app">
        <div id="problem-description">Select an Example below to load the word problem and start the simulation.</div>
        
        <canvas id="physicsCanvas" width="800" height="150"></canvas>
        
        <div class="controls">
            <button onclick="setup('ex1')">Ex 1: Bouncing</button>
            <button onclick="setup('ex2')">Ex 2: Bowling</button>
            <button onclick="setup('ex3')">Ex 3: Train</button>
            <button onclick="setup('ex4')">Ex 4: Recoil</button>
            <button onclick="reset()" style="background:#6c757d">Reset</button>
        </div>

        <div class="toggle-container">
            <span class="toggle-label">Hide Answers</span>
            <label class="switch">
                <input type="checkbox" id="answerToggle" onchange="toggleAnswers()">
                <span class="slider"></span>
            </label>
            <span class="toggle-label">Show Answers</span>
        </div>

        <h3 style="text-align: center; margin-top: 25px;">Data Table (p = mv)</h3>
        <table class="momentum-table" id="momentumTable">
            <thead>
                <tr>
                    <th rowspan="2">Object</th>
                    <th colspan="3" class="header-before">BEFORE Collision</th>
                    <th colspan="3" class="header-after">AFTER Collision</th>
                </tr>
                <tr>
                    <th class="header-before">Mass (kg)</th>
                    <th class="header-before">Vel (m/s)</th>
                    <th class="header-before">Mom (kg·m/s)</th>
                    <th class="header-after">Mass (kg)</th>
                    <th class="header-after">Vel (m/s)</th>
                    <th class="header-after">Mom (kg·m/s)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
            <tfoot>
                <tr class="total-row">
                    <td>TOTALS</td>
                    <td colspan="2">---</td>
                    <td id="total-pi">-</td>
                    <td colspan="2">---</td>
                    <td id="total-pf">-</td>
                </tr>
            </tfoot>
        </table>

        <div id="algebra-box"></div>
    </div>

<script>
    const canvas = document.getElementById('physicsCanvas'), ctx = canvas.getContext('2d');
    const descBox = document.getElementById('problem-description'), algebraBox = document.getElementById('algebra-box');
    const answerToggle = document.getElementById('answerToggle');
    const tableBody = document.getElementById('tableBody');
    const table = document.getElementById('momentumTable');
    
    let objs = [], mode = '', collision = false;

    const scenarios = {
        ex1: {
            desc: "<b>Ex 1:</b> An 8kg grey ball at 3 m/s and a 5kg white ball at -7 m/s collide. The grey ball bounces back at -2 m/s. What is the velocity of the white ball?",
            math: "<b>Step-by-Step Algebra:</b><br>\\(m_1v_{1i} + m_2v_{2i} = m_1v_{1f} + m_2v_{2f}\\) <br> \\((8)(3) + (5)(-7) = (8)(-2) + (5)(v_{2f})\\) <br> \\(24 - 35 = -16 + 5v_{2f}\\) <br> \\(-11 = -16 + 5v_{2f} \\rightarrow 5 = 5v_{2f}\\) <br> \\(v_{2f} = 1\\text{ m/s}\\)",
            data: { m1: 8, v1i: 3, m2: 5, v2i: -7, v1f: -2, v2f: "v_{2f}", ansV2f: 1, scale: 12 }
        },
        ex2: {
            desc: "<b>Ex 2:</b> A 4kg bowling ball heads towards a stationary pin at 5 m/s. After being struck the pin travels to the right at 3.2 m/s, and the bowling ball slows to 4.5 m/s. What is the mass of the pin?",
            math: "<b>Step-by-Step Algebra:</b><br>\\(m_1v_{1i} + m_2v_{2i} = m_1v_{1f} + m_2v_{2f}\\) <br> \\((4)(5) + (m_2)(0) = (4)(4.5) + (m_2)(3.2)\\) <br> \\(20 = 18 + 3.2m_2\\) <br> \\(2 = 3.2m_2 \\rightarrow m_2 = 0.625\\text{ kg}\\)",
            data: { m1: 4, v1i: 5, m2: "m_2", v2i: 0, v1f: 4.5, v2f: 3.2, ansM2: 0.625, scale: 15 }
        },
        ex3: {
            desc: "<b>Ex 3:</b> A 500kg car moving at 7.5 m/s couples to a stationary 600kg car. What is the final combined velocity?",
            math: "<b>Step-by-Step Algebra:</b><br>\\(m_1v_{1i} + m_2v_{2i} = (m_1 + m_2)v_{f}\\) <br> \\((500)(7.5) + (600)(0) = (1100)(v_{f})\\) <br> \\(3750 = 1100v_{f} \\rightarrow v_{f} = 3.41\\text{ m/s}\\)",
            data: { m1: 500, v1i: 7.5, m2: 600, v2i: 0, v1f: "v_f", v2f: "v_f", ansV1f: 3.41, ansV2f: 3.41, scale: 1.5 }
        },
        ex4: {
            desc: "<b>Ex 4:</b> A 500kg cannon fires a 10kg ball at 30 m/s. Both start at rest. What is the recoil velocity of the cannon?",
            math: "<b>Step-by-Step Algebra:</b><br>\\(m_1v_{1i} + m_2v_{2i} = m_1v_{1f} + m_2v_{2f}\\) <br> \\((500)(0) + (10)(0) = (500)(v_{1f}) + (10)(30)\\) <br> \\(0 = 500v_{1f} + 300\\) <br> \\(-300 = 500v_{1f} \\rightarrow v_{1f} = -0.6\\text{ m/s}\\)",
            data: { m1: 500, v1i: 0, m2: 10, v2i: 0, v1f: "v_{1f}", v2f: 30, ansV1f: -0.6, scale: 1.5 }
        }
    };

    function toggleAnswers() {
        if(mode) updateTableDisplay(mode, answerToggle.checked);
    }

    function updateTableDisplay(type, showResults = false) {
        const d = scenarios[type].data;
        
        // Resolve numerical values for calculation
        const numM1 = (typeof d.m1 === 'number') ? d.m1 : (d.ansM1 || 0);
        const numM2 = (typeof d.m2 === 'number') ? d.m2 : (d.ansM2 || 0);
        const numV1f = (typeof d.v1f === 'number') ? d.v1f : (d.ansV1f || 0);
        const numV2f = (typeof d.v2f === 'number') ? d.v2f : (d.ansV2f || 0);
        
        const pi1 = numM1 * d.v1i, pi2 = numM2 * d.v2i, piT = pi1 + pi2;

        if(showResults) algebraBox.style.display = "block";
        else algebraBox.style.display = "none";

        function formatCell(template, resolvedVal) {
            if (typeof template === 'number') return template.toString();
            return showResults ? `\\(${template} = ${resolvedVal}\\)` : `\\(${template}\\)`;
        }

        function formatMom(m_temp, m_val, v_temp, v_val) {
            const isMVar = typeof m_temp !== 'number';
            const isVVar = typeof v_temp !== 'number';
            if (!isMVar && !isVVar) return (m_val * v_val).toFixed(1);
            
            const momVal = (m_val * v_val).toFixed(1);
            const mDisp = isMVar ? m_temp : m_temp;
            const vDisp = isVVar ? v_temp : v_temp;
            
            return showResults ? `\\(${mDisp} \\cdot ${vDisp} = ${momVal}\\)` : `\\(${mDisp} \\cdot ${vDisp}\\)`;
        }

        tableBody.innerHTML = `
            <tr>
                <td>Obj 1</td>
                <td class="${typeof d.m1 !== 'number'?'variable':''}">${formatCell(d.m1, numM1)}</td>
                <td>${d.v1i}</td>
                <td>${formatMom(d.m1, numM1, d.v1i, d.v1i)}</td>
                <td class="${typeof d.m1 !== 'number'?'variable':''}">${formatCell(d.m1, numM1)}</td>
                <td class="${typeof d.v1f !== 'number'?'variable':''}">${formatCell(d.v1f, numV1f)}</td>
                <td>${formatMom(d.m1, numM1, d.v1f, numV1f)}</td>
            </tr>
            <tr>
                <td>Obj 2</td>
                <td class="${typeof d.m2 !== 'number'?'variable':''}">${formatCell(d.m2, numM2)}</td>
                <td>${d.v2i}</td>
                <td>${formatMom(d.m2, numM2, d.v2i, d.v2i)}</td>
                <td class="${typeof d.m2 !== 'number'?'variable':''}">${formatCell(d.m2, numM2)}</td>
                <td class="${typeof d.v2f !== 'number'?'variable':''}">${formatCell(d.v2f, numV2f)}</td>
                <td>${formatMom(d.m2, numM2, d.v2f, numV2f)}</td>
            </tr>
        `;
        
        document.getElementById('total-pi').innerText = piT.toFixed(1);
        document.getElementById('total-pf').innerHTML = showResults ? `\\(p_{total} = ${piT.toFixed(1)}\\)` : "\\(p_{total}\\)";
        
        if(window.MathJax) MathJax.typeset([table, algebraBox]);
    }

    class Obj {
        constructor(id, x, y, m, v, color, label, scale) {
            this.id = id; this.x = x; this.y = y; this.m = m; this.v = v; this.color = color; this.label = label;
            this.r = Math.sqrt(m) * scale;
            if(this.r < 10) this.r = 10;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#333'; ctx.stroke();
            ctx.fillStyle = 'black'; ctx.textAlign = "center";
            ctx.font = "bold 12px sans-serif"; ctx.fillText(this.label, this.x, this.y - this.r - 10);
            ctx.font = "11px monospace"; ctx.fillText(this.v.toFixed(2)+' m/s', this.x, this.y + this.r + 20);
        }
    }

    function setup(type) {
        objs = []; collision = false; mode = type;
        answerToggle.checked = false;
        descBox.innerHTML = scenarios[type].desc;
        algebraBox.innerHTML = scenarios[type].math;
        updateTableDisplay(type, false);

        const s = scenarios[type].data.scale;
        if (type == 'ex1') { 
            objs.push(new Obj(0, 100, 75, 8, 3, '#888', 'Grey Ball', s), new Obj(1, 700, 75, 5, -7, '#eee', 'White Ball', s)); 
        } else if (type == 'ex2') { 
            objs.push(new Obj(0, 100, 75, 4, 5, '#007bff', 'Ball', s), new Obj(1, 600, 75, 0.625, 0, '#dc3545', 'Pin', s)); 
        } else if (type == 'ex3') { 
            objs.push(new Obj(0, 100, 75, 500, 7.5, '#007bff', 'Car 1', s), new Obj(1, 600, 75, 600, 0, '#28a745', 'Car 2', s)); 
        } else if (type == 'ex4') { 
            objs.push(new Obj(0, 400, 75, 500, 0, '#333', 'Cannon', s), new Obj(1, 415, 75, 10, 0, '#ffc107', 'Ball', s)); 
            setTimeout(() => { if(mode=='ex4'){ objs[0].v = -0.6; objs[1].v = 30; } }, 1000); 
        }
        animate();
    }

    function animate() {
        ctx.clearRect(0,0,800,150);
        if (objs.length == 2 && !collision && mode != 'ex4') {
            if (Math.abs(objs[0].x - objs[1].x) < (objs[0].r + objs[1].r)) {
                collision = true;
                if(mode=='ex1'){ objs[0].v = -2; objs[1].v = 1; }
                else if(mode=='ex2'){ objs[0].v = 4.5; objs[1].v = 3.2; }
                else if(mode=='ex3'){ objs[0].v = 3.41; objs[1].v = 3.41; }
            }
        }
        objs.forEach(o => { o.x += o.v * 0.2; o.draw(); });
        requestAnimationFrame(animate);
    }

    function reset() { location.reload(); }
</script>
</body>
</html>
